<div class="container"
  style="margin-top: 100px; display: flex; flex-direction: column; justify-content: center;"
>
  <form [formGroup]="form" (ngSubmit)="load()">
    <div class="groups">
      <mat-form-field appearance="outline" style="width: 25%;">
        <mat-label>Date</mat-label>
        <input
          matInput
          [matDatepicker]="picker"
          formControlName="date"
        />
        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>
      <mat-form-field class="width" appearance="outline" style="width: 25%;">
        <mat-label>Line code</mat-label>
        <input
          matInput
          placeholder="Line"
          formControlName="lineId"
          name="lineId"
          (input)="onLineInputChange($event)"
          aria-label="Bus Line"
          [matAutocomplete]="auto"
        />
        <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayLine">
          <mat-option *ngFor="let line of filteredLine" [value]="line.line_code" (onSelectionChange)="onLineSelect($event)">
            <span>{{ line.line_id }} | {{ line.line_descr }}</span>
          </mat-option>
        </mat-autocomplete>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Route code</mat-label>
        <input
          matInput placeholder="Route"
          aria-label="Country"
          formControlName="routeId"
          name="routeId"
          [matAutocomplete]="auto01"
        />
        <mat-autocomplete #auto01="matAutocomplete" [displayWith]="displayRoute">
          <mat-option *ngFor="let route of routeObservable" [value]="route.code">
            <span>{{ route.code }} | {{ route.descr }}</span>
          </mat-option>
        </mat-autocomplete>
      </mat-form-field>
    </div>
    <div class="groups">
      <mat-form-field class="width" appearance="outline" style="width: 10%;">
        <mat-label>Bucket (min)</mat-label>
        <input
          type="number"
          matInput placeholder="Bucket (min)"
          formControlName="bucketMin"
          name="bucketMin"
          aria-label="Bucket (min)"
          step="1"
        />
      </mat-form-field>
      <mat-form-field class="width" appearance="outline" style="width: 10%;">
        <mat-label>LF Low threashold</mat-label>
        <input
          type="number"
          matInput placeholder="LF Low threashold"
          formControlName="lf"
          name="lf"
          aria-label="LF Low threashold"
          step="0.01"
        />
      </mat-form-field>
      <mat-form-field class="width" appearance="outline" style="width: 10%;">
        <mat-label>LF High threashold</mat-label>
        <input
          type="number"
          matInput placeholder="LF High threashold"
          formControlName="hf"
          name="hf"
          aria-label="LF High threashold"
          step="0.01"
        />
      </mat-form-field>
      <button type="submit" [disabled]="loading || form.invalid">Load</button>
      <button (click)="resetZoom()" [disabled]="form.invalid">Reset Zoom</button>
    </div>

  </form>
  <canvas #canvas id="kpi-canvas" style="height: 500px !important;"></canvas>
</div>
